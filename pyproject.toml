[project]
name = "roadsign-detector-part1"
version = "1.0.0"
description = "Classical OpenCV colour and shape detector for coursework Part 1"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.11,<5",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
